AWSTemplateFormatVersion: '2010-09-09'
Description: '3-Tier Architecture - CloudFront Stack (ALB Origin)'

# -----------------------------------------------------------
# 배포 리전: us-east-1 (Route53, ACM과 동일 리전에서 ImportValue 공유)
# CloudFront는 글로벌 서비스이므로 us-east-1에 배포해도 동일하게 동작합니다.
#
# ALB(ap-northeast-2)를 Origin으로 사용하며, ALB DNS Name은 파라미터로 전달합니다.
# (크로스 리전이지만 DNS 이름은 글로벌이므로 문제 없음)
# 동적 트래픽을 위해 캐시를 비활성화합니다.
# 현재 도메인 미구매 상태로 CloudFront 기본 도메인(xxx.cloudfront.net)을 사용합니다.
#
# 참고: CloudFormation Export/ImportValue는 동일 리전에서만 동작하므로
#       02-route53, 03-acm, 04-cloudfront는 모두 us-east-1에 배포해야 합니다.
#
# TODO: 도메인 구매 후 Aliases, ViewerCertificate, DNSRecord 활성화
# TODO: ALB 배포 후 parameters/cloudfront.json의 ALBDnsName을 실제 값으로 변경
# -----------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: 'three-tier'

  Environment:
    Type: String
    Default: 'dev'

  ALBDnsName:
    Type: String
    Description: 'ALB DNS name (e.g. my-alb-123456.ap-northeast-2.elb.amazonaws.com)'

Resources:
  # CloudFront Distribution
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName}-${Environment}-distribution'
        # TODO: 도메인 구매 후 아래 Aliases 활성화
        # Aliases:
        #   - !Ref DomainName
        Origins:
          - Id: ALBOrigin
            DomainName: !Ref ALBDnsName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: ALBOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: '4135ea2d-6df8-44a3-9df3-4b5a84be39ad'  # CachingDisabled
          OriginRequestPolicyId: '216adef6-5c7f-47e4-b989-5492eafa07d3'  # AllViewer
        # TODO: 도메인 구매 후 아래 ViewerCertificate 활성화
        # ViewerCertificate:
        #   AcmCertificateArn:
        #     Fn::ImportValue: !Sub '${ProjectName}-${Environment}-CertificateArn'
        #   SslSupportMethod: sni-only
        #   MinimumProtocolVersion: TLSv1.2_2021
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        HttpVersion: http2
        PriceClass: PriceClass_200
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-distribution'
        - Key: Environment
          Value: !Ref Environment

  # TODO: 도메인 구매 후 아래 Route 53 Alias Record 활성화
  # DNSRecord:
  #   Type: AWS::Route53::RecordSet
  #   Properties:
  #     HostedZoneId:
  #       Fn::ImportValue: !Sub '${ProjectName}-${Environment}-PublicHostedZoneId'
  #     Name: !Ref DomainName
  #     Type: A
  #     AliasTarget:
  #       DNSName: !GetAtt Distribution.DomainName
  #       HostedZoneId: Z2FDTNDATAQYW2  # CloudFront fixed hosted zone ID

Outputs:
  DistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref Distribution
    Export:
      Name: !Sub '${ProjectName}-${Environment}-DistributionId'

  DistributionDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt Distribution.DomainName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-DistributionDomainName'

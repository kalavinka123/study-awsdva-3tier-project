AWSTemplateFormatVersion: '2010-09-09'
Description: '3-Tier Architecture - Secrets Manager for RDS Credentials'

Parameters:
  ProjectName:
    Type: String
    Default: 'three-tier'
  Environment:
    Type: String
    Default: 'dev'

Resources:
  # KMS Key for Secrets Manager encryption
  SecretsKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'KMS key for encrypting RDS secrets'
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow Secrets Manager to use the key
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
            Resource: '*'

  SecretsKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-${Environment}-secrets'
      TargetKeyId: !Ref SecretsKmsKey

  RDSSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/${ProjectName}-db'
      Description: 'RDS MySQL database credentials'
      KmsKeyId: !Ref SecretsKmsKey
      GenerateSecretString:
        SecretStringTemplate: '{"username":"admin"}'
        GenerateStringKey: 'password'
        PasswordLength: 16
        ExcludeCharacters: '"@/\\'

Outputs:
  RDSSecretArn:
    Description: 'ARN of the RDS credentials secret'
    Value: !Ref RDSSecret
    Export:
      Name: !Sub '${ProjectName}-${Environment}-RdsSecretArn'
  
  RDSSecretName:
    Description: 'Name of the RDS credentials secret'
    Value: !Sub '${Environment}/${ProjectName}-db'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-RdsSecretName'

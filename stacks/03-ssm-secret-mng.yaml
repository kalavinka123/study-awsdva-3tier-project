AWSTemplateFormatVersion: '2010-09-09'
Description: '3-Tier Architecture - Secrets Manager for RDS Credentials'

Parameters:
  ProjectName:
    Type: String
    Default: 'three-tier'
  Environment:
    Type: String
    Default: 'dev'
  DBUser:
    Type: String
    Default: 'admin'

Resources:
  RDSSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/${ProjectName}-db'
      Description: 'RDS MySQL database credentials'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUser}"}'
        GenerateStringKey: 'password'
        PasswordLength: 16
        ExcludeCharacters: '"@/\\'

Outputs:
  RDSSecretArn:
    Description: 'ARN of the RDS credentials secret'
    Value: !Ref RDSSecret
    Export:
      Name: !Sub '${ProjectName}-${Environment}-RdsSecretArn'
  
  RDSSecretName:
    Description: 'Name of the RDS credentials secret'
    Value: !Sub '${Environment}/${ProjectName}-db'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-RdsSecretName'

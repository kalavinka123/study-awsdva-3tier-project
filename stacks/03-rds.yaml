AWSTemplateFormatVersion: '2010-09-09'
Description: '3-Tier Architecture - RDS MySQL (Primary Only)'

Parameters:
  ProjectName:
    Type: String
    Default: 'three-tier'
  Environment:
    Type: String
    Default: 'dev'
  DBUser:
    Type: String
    Default: 'admin'
  DBPassword:
    Type: String
    NoEcho: true
    Description: 'DB password (min 8 chars)'

Resources:
  # 1. RDS용 보안 그룹 (Security Group)
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Security group for RDS MySQL'
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId' # 네트워크 파일과 연결
      SecurityGroupIngress:
        # 테스트를 위해 임시로 내부 네트워크(VPC 전체) 대역 10.0.0.0/16 에서의 접속 허용
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: '10.0.0.0/16'

  # 2. DB 서브넷 그룹 (DB Subnet Group)
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: 'Subnet group for RDS DB'
      SubnetIds:
        # 네트워크 파일에서 만든 DB 전용 서브넷 2개 연결
        - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-DBSubnet1Id'
        - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-DBSubnet2Id'

  # 3. RDS 인스턴스 (Primary 1개)
  PrimaryDBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: mysql
      EngineVersion: '8.0.15'
      DBInstanceClass: db.t3.micro # 프리티어 및 테스트용
      AllocatedStorage: 20
      MasterUsername: !Ref DBUser
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      PubliclyAccessible: false # DB 서브넷에 있으므로 외부 인터넷에서 직접 접근 불가
      MultiAZ: false # 요구사항: Read Replica 무시, Primary 하나만

Outputs:
  RDSEndpoint:
    Description: 'RDS Connection Endpoint'
    Value: !GetAtt PrimaryDBInstance.Endpoint.Address
    Export:
      Name: !Sub '${ProjectName}-${Environment}-RdsEndpoint'
AWSTemplateFormatVersion: '2010-09-09'
Description: '3-Tier Architecture - RDS MySQL (Primary Only)'

Parameters:
  ProjectName:
    Type: String
    Default: 'three-tier'
  Environment:
    Type: String
    Default: 'dev'

Resources:
  # 1. RDS용 보안 그룹 (Security Group)
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Security group for RDS MySQL'
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: '10.0.0.0/16'
          Description: 'Allow MySQL access from VPC internal network'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: '127.0.0.1/32'
          Description: 'Deny all outbound traffic by default'

  # 2. DB 서브넷 그룹 (DB Subnet Group)
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: 'Subnet group for RDS DB'
      SubnetIds:
        # 네트워크 파일에서 만든 DB 전용 서브넷 2개 연결
        - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-DBSubnet1Id'
        - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-DBSubnet2Id'

  # 3. RDS 인스턴스 (Primary 1개)
  PrimaryDBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      EngineVersion: '8.4.5'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageEncrypted: true
      MasterUsername: !Sub '{{resolve:secretsmanager:${Environment}/${ProjectName}-db:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${Environment}/${ProjectName}-db:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      DeletionProtection: true
      BackupRetentionPeriod: 7
      PreferredBackupWindow: '03:00-04:00'
      PreferredMaintenanceWindow: 'sun:04:00-sun:05:00'

Outputs:
  RDSEndpoint:
    Description: 'RDS Connection Endpoint'
    Value: !GetAtt PrimaryDBInstance.Endpoint.Address
    Export:
      Name: !Sub '${ProjectName}-${Environment}-RdsEndpoint'

  RdsSecurityGroupId:
    Description: 'RDS Security Group ID'
    Value: !Ref DBSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-RdsSecurityGroupId'
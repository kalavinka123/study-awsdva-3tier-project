Parameters:
  ProjectName:
    Type: String
    Default: three-tier

  Environment:
    Type: String
    Default: dev

  ContainerImage:
    Type: String

  ContainerPort:
    Type: Number
    Default: 80

  Cpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]

  Memory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048", "3072", "4096", "5120", "6144", "7168", "8192", "16384", "30720"]

  DesiredCount:
    Type: Number
    Default: 1

Resources:
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - kms:Decrypt
                Resource: '*'

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${Environment}"
      RequiresCompatibilities: ["FARGATE"]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-TaskExecutionRoleArn"
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub "${ProjectName}-${Environment}"
          Image: !Ref ContainerImage
          Essential: true
          Environment:
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub "${ProjectName}-${Environment}-RdsEndpoint"
            - Name: DB_NAME
              Value: testdb
            - Name: DB_SECRET_NAME
              Value: !Sub "${Environment}/${ProjectName}-db"
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub "${ProjectName}-${Environment}-LogGroupName"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-${Environment}-svc"
      Cluster:
        Fn::ImportValue: !Sub "${ProjectName}-${Environment}-EcsClusterArn"
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition

      # ALB Target Group 연결
      LoadBalancers:
        - ContainerName: !Sub "${ProjectName}-${Environment}"
          ContainerPort: !Ref ContainerPort
          TargetGroupArn:
            Fn::ImportValue: !Sub "${ProjectName}-${Environment}-AlbTargetGroupArn"

      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-PrivateSubnet1Id"
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-PrivateSubnet2Id"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${ProjectName}-${Environment}-TaskSecurityGroupId"
          AssignPublicIp: DISABLED  # Private subnet
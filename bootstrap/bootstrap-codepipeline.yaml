AWSTemplateFormatVersion: '2010-09-09'
Description: 'CodePipeline for 3-Tier Infrastructure'

Parameters:
  ProjectName:
    Type: String
    Default: 'three-tier'
    Description: Project name for resource naming

  GitHubRepositoryId:
    Type: String
    Default: 'kalavinka123/study-awsdva-3tier-project'
    Description: 'GitHub repository Id. The format: "GitHubOwner/GitHubRepo"'

  GitHubDefaultBranch:
    Type: String
    Default: 'feature/codepipeline-test-integration' ## TODO: release/**
    Description: GitHub default branch name

Resources:
  # ============================================================================
  # Pre-requisite Resources
  # ============================================================================

  CodePipelineArtifactStoreBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-codepipeline-artifacts-${AWS::Region}-${AWS::AccountId}'

  CodePipelineArtifactStoreBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CodePipelineArtifactStoreBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Sid: DenyUnEncryptedObjectUploads
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Join [ '', [ !GetAtt CodePipelineArtifactStoreBucket.Arn, '/*' ] ]
            Condition:
              StringNotEquals: 
                s3:x-amz-server-side-encryption: aws:kms
          -
            Sid: DenyInsecureConnections
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: !Join [ '', [ !GetAtt CodePipelineArtifactStoreBucket.Arn, '/*' ] ]
            Condition:
              Bool:
                aws:SecureTransport: false

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-codepipeline-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals: 
                aws:SourceAccount: !Sub ${AWS::AccountId}
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - !GetAtt CodePipelineArtifactStoreBucket.Arn
                  - !Sub '${CodePipelineArtifactStoreBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref GithubConnection
              - Effect: Allow
                Action:
                  - cloudformation:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource:
                  - !GetAtt CfnLintProject.Arn
                  - !GetAtt CfnNagProject.Arn
                  - !GetAtt CfnValidateProject.Arn

  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-cloudformation-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  GithubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Sub '${ProjectName}-codeconnection-github'
      ProviderType: GitHub
      # Tags:
      # - Key: Project
      #   Value: ProjectB

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-codebuild-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub '${CodePipelineArtifactStoreBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt CodePipelineArtifactStoreBucket.Arn
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                Resource: '*'

  CfnValidateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-cfn-validate'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0 ## TODO: Use pre-installed image
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - echo Starting AWS CloudFormation validate-template
                - |
                  for template in stacks/*.yaml; do
                    echo "Validating $template"
                    aws cloudformation validate-template --template-body file://$template
                  done
                - echo CloudFormation validation completed successfully

  CfnLintProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-cfn-lint'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0 ## TODO: Use pre-installed image
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.11
              commands:
                - echo Installing cfn-lint
                - pip install cfn-lint
            build:
              commands:
                - echo Starting cfn-lint validation
                - cfn-lint stacks/*.yaml --info
                - echo cfn-lint validation completed successfully

  CfnNagProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-cfn-nag'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0 ## TODO: Use pre-installed image
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                ruby: 3.1
              commands:
                - echo Installing cfn-nag
                - gem install cfn-nag
            build:
              commands:
                - echo Starting cfn-nag security validation
                - cfn_nag_scan --input-path stacks/
                - echo cfn-nag validation completed successfully

  # ============================================================================
  # CodePipeline Resource
  # ============================================================================

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}-infra-pipeline'
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref CodePipelineArtifactStoreBucket

      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: GitHubSource
            Push:
              - Branches:
                  Includes:
                    - !Ref GitHubDefaultBranch ## TODO: release/**
                  Excludes:
                    - main
                FilePaths:
                  Excludes:
                    - '**/README.md'
                    - '**/LICENSE'
                    - '**/CONTRIBUTING.md'
                    - '.github'

      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              InputArtifacts: []
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: '1'
                Provider: CodeStarSourceConnection
              OutputArtifacts:
                - Name: SourceOutputArtifact
              Configuration:
                BranchName: !Ref GitHubDefaultBranch
                ConnectionArn: !Ref GithubConnection
                FullRepositoryId: !Ref GitHubRepositoryId
                OutputArtifactFormat: CODE_ZIP
              RunOrder: 1

        - Name: Validate
          Actions:
            - Name: CfnValidate
              InputArtifacts:
                - Name: SourceOutputArtifact
              OutputArtifacts: []
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: '1'
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CfnValidateProject
              RunOrder: 1
            - Name: CfnLint
              InputArtifacts:
                - Name: SourceOutputArtifact
              OutputArtifacts: []
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: '1'
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CfnLintProject
              RunOrder: 1
            - Name: CfnNag
              InputArtifacts:
                - Name: SourceOutputArtifact
              OutputArtifacts: []
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: '1'
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CfnNagProject
              RunOrder: 1

        - Name: CreateChangeSet-Network-Dev
          Actions:
            - Name: CreateChangeSet
              InputArtifacts:
                - Name: SourceOutputArtifact
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CHANGE_SET_REPLACE
                StackName: !Sub '${ProjectName}-Network-Dev'
                ChangeSetName: !Sub '${ProjectName}-Network-Dev-ChangeSet'
                TemplatePath: SourceOutputArtifact::stacks/01-network.yaml
                TemplateConfiguration: SourceOutputArtifact::parameters/dev.json
                RoleArn: !GetAtt CloudFormationRole.Arn
                Capabilities: CAPABILITY_NAMED_IAM
              RunOrder: 1

        - Name: ApprovalForNetwork-Dev
          Actions:
            - Name: ApproveChangeSet
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Version: '1'
                Provider: Manual
              Configuration:
                CustomData: 'Please review the Network Dev changeset and approve to proceed with deployment'
              RunOrder: 1

        - Name: Deploy-Network-Dev
          Actions:
            - Name: ExecuteChangeSet
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CHANGE_SET_EXECUTE
                StackName: !Sub '${ProjectName}-Network-Dev'
                ChangeSetName: !Sub '${ProjectName}-Network-Dev-ChangeSet'
              RunOrder: 1

        ## TODO: More stages to come
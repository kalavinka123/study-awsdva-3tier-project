AWSTemplateFormatVersion: '2010-09-09'
Description: 'CodePipeline for 3-Tier Infrastructure'

Parameters:
  ProjectName:
    Type: String
    Default: 'three-tier'
    Description: Project name for resource naming

  GitHubRepositoryId:
    Type: String
    Default: 'kalavinka123/study-awsdva-3tier-project'
    Description: 'GitHub repository Id. The format: "GitHubOwner/GitHubRepo"'

  GitHubDefaultBranch:
    Type: String
    Default: 'test/integration-test-branch' ## TODO: release/**
    Description: GitHub default branch name

Resources:
  # ============================================================================
  # Pre-requisite Resources
  # ============================================================================

  CodePipelineArtifactStoreBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-codepipeline-artifacts-${AWS::Region}-${AWS::AccountId}'

  CodePipelineArtifactStoreBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CodePipelineArtifactStoreBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Sid: DenyUnEncryptedObjectUploads
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Join [ '', [ !GetAtt CodePipelineArtifactStoreBucket.Arn, '/*' ] ]
            Condition:
              StringNotEquals: 
                s3:x-amz-server-side-encryption: aws:kms
          -
            Sid: DenyInsecureConnections
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: !Join [ '', [ !GetAtt CodePipelineArtifactStoreBucket.Arn, '/*' ] ]
            Condition:
              Bool:
                aws:SecureTransport: false

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-codepipeline-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals: 
                aws:SourceAccount: !Sub ${AWS::AccountId}
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - !GetAtt CodePipelineArtifactStoreBucket.Arn
                  - !Sub '${CodePipelineArtifactStoreBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref GithubConnection
              - Effect: Allow
                Action:
                  - cloudformation:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*' ## TODO: Specify Resource
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource:
                  - !GetAtt CfnLintProject.Arn
                  - !GetAtt CfnNagProject.Arn
                  - !GetAtt CfnValidateProject.Arn
                  - !GetAtt RdsInitProject.Arn

  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-cloudformation-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:  ## TODO: Finer-grain permission
        - arn:aws:iam::aws:policy/AdministratorAccess

  GithubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Sub '${ProjectName}-codeconnection-github'
      ProviderType: GitHub
      # Tags:
      # - Key: Project
      #   Value: ProjectB

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-codebuild-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub '${CodePipelineArtifactStoreBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt CodePipelineArtifactStoreBucket.Arn
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - secretsmanager:GetSecretValue
                  - kms:Decrypt
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeDhcpOptions
                  - ec2:DescribeVpcs
                  - ec2:CreateNetworkInterfacePermission
                Resource: '*'

  CfnValidateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-cfn-validate'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0 ## TODO: Use pre-installed image
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - echo Starting AWS CloudFormation validate-template
                - |
                  for template in stacks/*.yaml; do
                    echo "Validating $template"
                    aws cloudformation validate-template --template-body file://$template
                  done
                - echo CloudFormation validation completed successfully

  CfnLintProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-cfn-lint'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0 ## TODO: Use pre-installed image
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.11
              commands:
                - echo Installing cfn-lint
                - pip install cfn-lint
            build:
              commands:
                - echo Starting cfn-lint validation
                - cfn-lint stacks/*.yaml --info
                - echo cfn-lint validation completed successfully

  CfnNagProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-cfn-nag'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0 ## TODO: Use pre-installed image
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                ruby: 3.1
              commands:
                - echo Installing cfn-nag
                - gem install cfn-nag
            build:
              commands:
                - echo Starting cfn-nag security validation
                - cfn_nag_scan --input-path stacks/
                - echo cfn-nag validation completed successfully

  RdsInitProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-rds-init'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
      VpcConfig:
        VpcId:
          Fn::ImportValue: !Sub '${ProjectName}-dev-VpcId'
        Subnets:
          - Fn::ImportValue: !Sub '${ProjectName}-dev-PrivateSubnet1Id'
          - Fn::ImportValue: !Sub '${ProjectName}-dev-PrivateSubnet2Id'
        SecurityGroupIds:
          - Fn::ImportValue: !Sub '${ProjectName}-dev-TaskSecurityGroupId'
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.11
              commands:
                - echo Installing MySQL client
                - dnf install -y mariadb105
            build:
              commands:
                - echo Retrieving RDS endpoint and credentials
                - export RDS_ENDPOINT=$(aws cloudformation describe-stacks --stack-name three-tier-RDS-Dev --query "Stacks[0].Outputs[?OutputKey=='RDSEndpoint'].OutputValue" --output text)
                - export DB_SECRET=$(aws secretsmanager get-secret-value --secret-id dev/three-tier-db --query SecretString --output text)
                - export DB_USER=$(echo $DB_SECRET | python3 -c "import sys, json; print(json.load(sys.stdin)['username'])")
                - export DB_PASSWORD=$(echo $DB_SECRET | python3 -c "import sys, json; print(json.load(sys.stdin)['password'])")
                - echo Initializing RDS database with schema
                - mysql -h $RDS_ENDPOINT -u $DB_USER -p$DB_PASSWORD < sql/init.sql
                - echo RDS initialization completed successfully

  # ============================================================================
  # CodePipeline Resource
  # ============================================================================

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}-infra-pipeline'
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref CodePipelineArtifactStoreBucket

      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: GitHubSource
            Push:
              - Branches:
                  Includes:
                    - !Ref GitHubDefaultBranch ## TODO: release/**
                  Excludes:
                    - main
                FilePaths:
                  Excludes:
                    - '**/README.md'
                    - '**/LICENSE'
                    - '**/CONTRIBUTING.md'
                    - '.github'

      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              InputArtifacts: []
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: '1'
                Provider: CodeStarSourceConnection
              OutputArtifacts:
                - Name: SourceOutputArtifact
              Configuration:
                BranchName: !Ref GitHubDefaultBranch
                ConnectionArn: !Ref GithubConnection
                FullRepositoryId: !Ref GitHubRepositoryId
                OutputArtifactFormat: CODE_ZIP
              RunOrder: 1

        - Name: Validate
          Actions:
            - Name: CfnValidate
              InputArtifacts:
                - Name: SourceOutputArtifact
              OutputArtifacts: []
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: '1'
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CfnValidateProject
              RunOrder: 1
            - Name: CfnLint
              InputArtifacts:
                - Name: SourceOutputArtifact
              OutputArtifacts: []
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: '1'
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CfnLintProject
              RunOrder: 1
            - Name: CfnNag
              InputArtifacts:
                - Name: SourceOutputArtifact
              OutputArtifacts: []
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: '1'
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CfnNagProject
              RunOrder: 1

        # -----------------------------------------------------------------------------      
        # CodePipeline - VPC
        # -----------------------------------------------------------------------------       
        - Name: Deploy-Network-Dev
          Actions:
            - Name: DeployStack
              InputArtifacts:
                - Name: SourceOutputArtifact
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${ProjectName}-Network-Dev'
                TemplatePath: SourceOutputArtifact::stacks/01-network.yaml
                TemplateConfiguration: SourceOutputArtifact::parameters/dev.json
                RoleArn: !GetAtt CloudFormationRole.Arn
                Capabilities: CAPABILITY_NAMED_IAM
              RunOrder: 1

        # -----------------------------------------------------------------------------      
        # CodePipeline - ECS
        # -----------------------------------------------------------------------------   
        - Name: Deploy-ECS-Dev
          Actions:
            - Name: DeployStack
              InputArtifacts:
                - Name: SourceOutputArtifact
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${ProjectName}-ECS-Dev'
                TemplatePath: SourceOutputArtifact::stacks/02-ecs.yaml
                RoleArn: !GetAtt CloudFormationRole.Arn
                Capabilities: CAPABILITY_NAMED_IAM
              RunOrder: 2       

        # -----------------------------------------------------------------------------      
        # CodePipeline - SSM
        # -----------------------------------------------------------------------------   
        - Name: Deploy-SSM-secretsmanager-Dev
          Actions:
            - Name: DeployStack
              InputArtifacts:
                - Name: SourceOutputArtifact
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${ProjectName}-SSM-secretsmanager-Dev'
                TemplatePath: SourceOutputArtifact::stacks/03-ssm-secret-mng.yaml
                RoleArn: !GetAtt CloudFormationRole.Arn
              RunOrder: 3  

        # -----------------------------------------------------------------------------      
        # CodePipeline - RDS
        # -----------------------------------------------------------------------------   
        - Name: Deploy-RDS-Dev
          Actions:
            - Name: DeployStack
              InputArtifacts:
                - Name: SourceOutputArtifact
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${ProjectName}-RDS-Dev'
                TemplatePath: SourceOutputArtifact::stacks/04-rds.yaml
                RoleArn: !GetAtt CloudFormationRole.Arn
              RunOrder: 4                  

        - Name: Initialize-RDS
          Actions:
            - Name: InitializeDatabase
              InputArtifacts:
                - Name: SourceOutputArtifact
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: '1'
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref RdsInitProject
              RunOrder: 5

Outputs:
  GithubConnectionArn:
    Description: GitHub connection ARN
    Value: !Ref GithubConnection
    Export:
      Name: !Sub '${ProjectName}-GithubConnectionArn'